name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run backend tests
        env:
          AI_TRADER_RATE_LIMIT: "0"
          AI_TRADER_FAKE_LLM: "1"
        run: python -m pytest tests -q
      - name: Import smoke test
        run: python -c "import ai_trader.server; import ai_trader.api.autopilot; import ai_trader.api.ratelimit"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check + production build
        run: npm run build
      - name: Run unit tests
        run: npx vitest run